[package]
name = "tablo"
version = "0.1.0"
edition = "2021"
description = "Lecteur CSV et JSON rapide — tableur léger, clavier et souris"
repository = "https://github.com/Yusufibin/tablo"
license = "MIT"
readme = "README.md"
keywords = ["csv", "json", "viewer", "egui", "gui"]
categories = ["visualization", "command-line-utilities"]

[dependencies]
csv = "1.3"
eframe = "0.37"
egui_extras = "0.37"
rfd = "0.15"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
